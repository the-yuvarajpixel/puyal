<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidResponse Command</title>
  <meta name="description" content="Emergency response & disaster management platform with incident reporting, SOS alerts, and live admin coordination." />
  <meta property="og:title" content="RapidResponse Command" />
  <meta property="og:description" content="Emergency response & disaster management platform with incident reporting, SOS alerts, and live admin coordination." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============================================================
       ROLE SELECTION — LANDING PAGE
       First page users see. Choose User or Admin to proceed.
       ============================================================ -->
  <div class="role-selection">
    <div class="role-container">
      <div class="hero-logo">
        <span class="sos-tag">SOS</span>
        <h1>RapidResponse Command</h1>
      </div>
      <p class="hero-subtitle">Emergency Response &amp; Disaster Management Platform</p>

      <div class="role-cards">
        <!-- User Card -->
        <a href="login-user.html" class="role-card user-role">
          <span class="role-icon">🆘</span>
          <div class="role-name">Report Emergency</div>
          <div class="role-desc">Report an emergency, use voice or SOS for instant help</div>
        </a>

        <!-- Admin Card -->
        <a href="login-admin.html" class="role-card admin-role">
          <span class="role-icon">🛡️</span>
          <div class="role-name">Admin Control</div>
          <div class="role-desc">Manage incidents, view live SOS feeds, coordinate response</div>
        </a>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <a href="login-user.html" style="text-decoration: none; font-size: 13px; color: #94a3b8; padding: 8px 18px; background: rgba(255,255,255,0.06); border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;">
          ⚡ Test Civilian Demo Account
        </a>
        <a href="login-admin.html" style="text-decoration: none; font-size: 13px; color: #94a3b8; padding: 8px 18px; background: rgba(255,255,255,0.06); border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;">
          🛡️ Test Admin Command Account
        </a>
      </div>
    </div>
  </div>

</body>
</html>
