<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidResponse — User Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <span class="sos-tag">SOS</span>
        <h1>RapidResponse</h1>
      </div>
      <span class="role-badge user-badge">Civilian Portal</span>
      <p class="login-subtitle">Sign in to report emergencies and access SOS features</p>

      <div id="login-error" class="login-error"></div>

      <form class="login-form" id="user-login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-login user-btn" id="btn-submit">
          Sign In
        </button>
        <div class="toggle-auth">
          <span id="toggle-text">Don't have an account?</span>
          <a id="toggle-link" onclick="toggleAuthMode()">Create one</a>
        </div>
        <div style="margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px;">
          <button type="button" class="btn" style="width: 100%; background: var(--navy-light); color: #fff; padding: 10px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; border: none;" onclick="demoLogin()">
            ⚡ Quick Demo Sign In
          </button>
        </div>
      </form>

      <a href="index.html" class="back-link">← Back to role selection</a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    let isSignUp = false;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('btn-submit').textContent = isSignUp ? 'Create Account' : 'Sign In';
      document.getElementById('toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggle-link').textContent = isSignUp ? 'Sign in' : 'Create one';
      document.getElementById('login-error').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function demoLogin() {
      const mockUser = { uid: 'user_demo_' + Date.now(), email: 'civilian@rapidresponse.local', role: 'user', displayName: 'Civilian User' };
      localStorage.setItem('currentUser', JSON.stringify(mockUser));
      localStorage.setItem('userRole', 'user');
      window.location.href = 'dashboard-user.html';
    }

    // Check if already logged in as user
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
      try {
        const u = JSON.parse(savedUser);
        if (u.role === 'user') {
          window.location.href = 'dashboard-user.html';
        }
      } catch (e) {}
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (doc.exists && doc.data().role === 'user') {
            localStorage.setItem('currentUser', JSON.stringify({ uid: user.uid, email: user.email, role: 'user', displayName: user.displayName || user.email.split('@')[0] }));
            window.location.href = 'dashboard-user.html';
          }
        } catch (e) {
          console.log('Auth check:', e);
        }
      }
    });

    document.getElementById('user-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      document.getElementById('login-error').style.display = 'none';

      try {
        let userCredential;
        if (isSignUp) {
          userCredential = await auth.createUserWithEmailAndPassword(email, password);
          // Store user profile with "user" role in Firestore
          await db.collection('users').doc(userCredential.user.uid).set({
            email: email,
            role: 'user',
            displayName: email.split('@')[0],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          userCredential = await auth.signInWithEmailAndPassword(email, password);
          // Verify role
          const doc = await db.collection('users').doc(userCredential.user.uid).get();
          if (doc.exists && doc.data().role !== 'user') {
            showError('This account is registered as Admin. Please use the Admin login.');
            auth.signOut();
            btn.disabled = false;
            btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
            return;
          }
        }

        const loggedUser = {
          uid: userCredential.user.uid,
          email: email,
          role: 'user',
          displayName: email.split('@')[0]
        };
        localStorage.setItem('currentUser', JSON.stringify(loggedUser));
        localStorage.setItem('userRole', 'user');
        window.location.href = 'dashboard-user.html';
      } catch (err) {
        console.warn('Firebase auth attempt returned:', err);
        if (err.code === 'auth/unauthorized-domain' || err.code === 'auth/api-key-not-valid' || (err.message && err.message.includes('authorized domain'))) {
          // Automatic local session fallback for preview environments
          const localUser = {
            uid: 'user_' + Date.now(),
            email: email,
            role: 'user',
            displayName: email.split('@')[0]
          };
          localStorage.setItem('currentUser', JSON.stringify(localUser));
          localStorage.setItem('userRole', 'user');
          window.location.href = 'dashboard-user.html';
          return;
        }

        let message = 'Authentication failed. Please try again.';
        if (err.code === 'auth/user-not-found') message = 'No account found. Please sign up first.';
        else if (err.code === 'auth/wrong-password') message = 'Incorrect password.';
        else if (err.code === 'auth/invalid-credential') message = 'Invalid credentials. Check email and password.';
        else if (err.code === 'auth/email-already-in-use') message = 'Email already registered. Try signing in.';
        else if (err.code === 'auth/weak-password') message = 'Password must be at least 6 characters.';
        else if (err.code === 'auth/invalid-email') message = 'Invalid email address format.';
        showError(message);
        btn.disabled = false;
        btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      }
    });
  </script>

</body>
</html>
